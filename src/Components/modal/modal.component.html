<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Adicionar Hábito</h2>

    <form [formGroup]="form" (ngSubmit)="onFormSubmit()">
      <input type="text" formControlName="nome" placeholder="Nome do hábito" />

      <div class="dias">
        <label *ngFor="let dia of dias">
          <input type="checkbox" [value]="dia.dia" (change)="onDiaSelecionado($event)" />
          {{ dia.dia }}
        </label>
      </div>

      <button type="submit">Salvar</button>
      <button type="button" class="fechar" (click)="closeModal()">Cancelar</button>
    </form>

    <p class="mensagem sucesso" *ngIf="mensagemSucesso">{{ mensagemSucesso }}</p>
    <p class="mensagem erro" *ngIf="mensagemErro">{{ mensagemErro }}</p>
  </div>
</div>
